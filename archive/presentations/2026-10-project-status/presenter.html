<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Template - Presenter</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="presenter">
  <div id="app">
    <main id="deck" aria-live="polite"></main>
  </div>

  <aside class="speaker-notes" id="speaker-notes" aria-live="polite">
    <div class="notes-heading">
      <span>Presenter notes</span>
      <span id="notes-slide-id"></span>
    </div>
    <div id="notes-content"></div>
  </aside>

  <div class="hint">
    Use <span class="kbd">Left</span> <span class="kbd">Right</span>
    <span class="kbd">N</span> notes <span class="kbd">D</span> debug
  </div>
  <div class="nav" aria-label="Presentation navigation">
    <button aria-label="Previous slide" id="prev">&lsaquo;</button>
    <span id="count">1 / 1</span>
    <button aria-label="Next slide" id="next">&rsaquo;</button>
  </div>

  <script src="deck-content.js"></script>
  <script src="speaker-notes.js"></script>
  <script src="deck.js"></script>
</body>
</html>
