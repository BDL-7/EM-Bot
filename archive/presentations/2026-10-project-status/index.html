<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Template</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app">
    <main id="deck" aria-live="polite"></main>
  </div>

  <div class="hint">
    Use <span class="kbd">Left</span> <span class="kbd">Right</span>
    <span class="kbd">F</span> fullscreen <span class="kbd">D</span> debug
  </div>
  <div class="nav" aria-label="Presentation navigation">
    <button aria-label="Previous slide" id="prev">&lsaquo;</button>
    <span id="count">1 / 1</span>
    <button aria-label="Next slide" id="next">&rsaquo;</button>
  </div>

  <script src="deck-content.js"></script>
  <script src="deck.js"></script>
</body>
</html>
